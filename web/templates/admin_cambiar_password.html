{{define "content"}}
<section class="page-head">
  <p class="eyebrow">Cuenta</p>
  <h1>Cambiar contraseña</h1>
  <p class="lead">Al guardar, se cierra la sesión actual y hay que iniciar
    sesión de nuevo con la contraseña nueva.</p>
</section>

{{if .Message}}
<div class="alert alert-{{.MessageKind}}">{{.Message}}</div>
{{end}}

<section class="panel panel-narrow">
  <form method="post" action="/admin/cambiar-password" class="form-grid">
    <label class="span-2">
      <span>Contraseña actual</span>
      <input type="password" name="actual" required>
    </label>
    <label class="span-2">
      <span>Contraseña nueva</span>
      <input type="password" name="nueva" required minlength="8">
    </label>
    <label class="span-2">
      <span>Confirmar contraseña nueva</span>
      <input type="password" name="confirmar" required minlength="8">
    </label>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Guardar y cerrar sesión</button>
    </div>
  </form>
</section>
{{end}}
