{{define "layout_auth"}}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Manualidades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"></div>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark">✂︎</span>
        <span class="brand-text">Manualidades<em>·admin</em></span>
      </div>
      {{template "content" .}}
    </div>
  </main>
</body>
</html>
{{end}}
